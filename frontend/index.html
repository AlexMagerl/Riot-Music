<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✊ Riot Music</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0e0e10" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/riot.css" />
</head>
<body>
  <!-- Icon-Satz (einmal definiert, per <use href="#i-…"> verwendet) -->
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-fist" viewBox="0 0 24 24">
      <rect x="7" y="15" width="10" height="8" rx="1"/>
      <rect x="5" y="7.5" width="14" height="9.5" rx="2.2"/>
      <g stroke="var(--icon-cut, #0e0e10)" stroke-width="1.1">
        <rect x="5" y="2.2" width="3.6" height="8" rx="1.6"/>
        <rect x="8.5" y="1.4" width="3.6" height="8.8" rx="1.6"/>
        <rect x="12" y="1.6" width="3.6" height="8.6" rx="1.6"/>
        <rect x="15.4" y="2.8" width="3.6" height="7.4" rx="1.6"/>
        <rect x="3" y="9.6" width="10.5" height="3.8" rx="1.9"/>
      </g>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3.5 21 12 6 20.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="3.5" width="5" height="17" rx="1"/><rect x="14" y="3.5" width="5" height="17" rx="1"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><rect x="3.5" y="4" width="3.2" height="16" rx="1"/><path d="M20.5 4 8.5 12l12 8z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><rect x="17.3" y="4" width="3.2" height="16" rx="1"/><path d="M3.5 4l12 8-12 8z"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square">
      <path d="M4 12V9.5A3.5 3.5 0 0 1 7.5 6H18"/><path d="M15 2.5 18.5 6 15 9.5"/>
      <path d="M20 12v2.5a3.5 3.5 0 0 1-3.5 3.5H6"/><path d="M9 21.5 5.5 18 9 14.5"/>
    </symbol>
    <symbol id="i-loop-one" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square">
        <path d="M4 12V9.5A3.5 3.5 0 0 1 7.5 6H18"/><path d="M15 2.5 18.5 6 15 9.5"/>
        <path d="M20 12v2.5a3.5 3.5 0 0 1-3.5 3.5H6"/><path d="M9 21.5 5.5 18 9 14.5"/>
      </g>
      <path d="M11 9.5h2.4v6H11v-3.6l-1 .5V10.4z"/>
    </symbol>
    <symbol id="i-volume" viewBox="0 0 24 24">
      <path d="M3 9h4l5.5-4.5v15L7 15H3z"/>
      <path d="M16 8.5a5 5 0 0 1 0 7M18.8 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-radio" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="2.6"/>
      <path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.2 3.6 12.8A5.2 5.2 0 0 1 11 5.4l1 1 1-1a5.2 5.2 0 0 1 7.4 7.4z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.5 2 11h3v10h5.5v-6h3v6H19V11h3z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></symbol>
    <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M3 9.5h4l10-5.5v16L7 14.5H3z"/><path d="M6 15.5 7.5 21h3l-1.4-5.5z"/><rect x="19" y="9.5" width="2.5" height="5" rx="1"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><path d="M2.5 5h19v14h-19z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="m3 6 9 7 9-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="12.5" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M8 21.5h8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7.5 1.5h9A2.5 2.5 0 0 1 19 4v16a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 20V4a2.5 2.5 0 0 1 2.5-2.5zM8 5v13h8V5z"/><circle cx="12" cy="20.2" r="1.1" fill="var(--icon-cut, #0e0e10)"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/></symbol>
  </svg>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="#/" class="brand">
        <span class="brand-mark"><svg class="ico brand-fist" aria-hidden="true"><use href="#i-fist"/></svg></span>
        <span class="brand-text">Riot<span class="brand-accent">Music</span></span>
      </a>
      <nav class="nav">
        <a href="#/" class="nav-link" data-route="home"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg>Start</a>
        <a href="#/catalog" class="nav-link" data-route="catalog"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>Katalog</a>
        <a href="#/manifest" class="nav-link" data-route="manifest"><svg class="ico" aria-hidden="true"><use href="#i-megaphone"/></svg>Manifest</a>
        <a href="#/kontakt" class="nav-link" data-route="kontakt"><svg class="ico" aria-hidden="true"><use href="#i-mail"/></svg>Kontakt</a>
        <a href="/artist.html" class="nav-link nav-studio"><svg class="ico" aria-hidden="true"><use href="#i-mic"/></svg>Für Künstler:innen</a>
        <a href="/admin.html" id="nav-admin" class="nav-link nav-admin" style="display:none"><svg class="ico" aria-hidden="true"><use href="#i-shield"/></svg>Admin-Zugang</a>
      </nav>
      <div class="sidebar-foot">
        <div class="legal-links">
          <a href="/impressum.html">Impressum</a>
          <a href="/datenschutz.html">Datenschutz</a>
          <a href="/agb.html">AGB</a>
        </div>
      </div>
    </aside>

    <!-- Hauptbereich -->
    <main class="main">
      <header class="topbar">
        <form id="search-form" class="search">
          <input id="search-input" type="search" placeholder="Künstler:innen, Releases, Songs suchen…" autocomplete="off" />
          <select id="search-genre" class="search-genre">
            <option value="">Alle Genres</option>
          </select>
          <button type="submit" class="search-btn">Suchen</button>
        </form>
        <button id="btn-radio" class="radio-btn" title="Endlose Zufallswiedergabe aller Künstler:innen">
          <span class="radio-dot"></span><svg class="ico" aria-hidden="true"><use href="#i-radio"/></svg>Radio
        </button>
        <button id="btn-donate" class="donate-btn" style="display:none" title="Direkt an die Künstler:in spenden">
          <svg class="ico" aria-hidden="true"><use href="#i-heart"/></svg><span class="donate-label">Spenden</span>
        </button>
      </header>
      <section id="view" class="view">
        <!-- Inhalt wird per JS gerendert -->
      </section>
    </main>
  </div>

  <!-- Persistenter Player -->
  <footer class="player" id="player" aria-label="Wiedergabe">
    <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>
    <div class="player-track">
      <div class="player-cover" id="player-cover"><svg class="ico cover-fist" aria-hidden="true"><use href="#i-fist"/></svg></div>
      <div class="player-meta">
        <div class="player-title" id="player-title">Nichts ausgewählt</div>
        <a class="player-artist" id="player-artist" href="#/"></a>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button id="btn-prev" class="ctrl" title="Vorheriger Track" aria-label="Vorheriger Track"><svg class="ico" aria-hidden="true"><use href="#i-prev"/></svg></button>
        <button id="btn-play" class="ctrl ctrl-play" title="Abspielen / Pause" aria-label="Abspielen"><svg class="ico" aria-hidden="true"><use href="#i-play"/></svg></button>
        <button id="btn-next" class="ctrl" title="Nächster Track" aria-label="Nächster Track"><svg class="ico" aria-hidden="true"><use href="#i-next"/></svg></button>
        <button id="btn-loop" class="ctrl ctrl-loop" title="Wiederholen: aus" aria-label="Wiederholen: aus"><svg class="ico" aria-hidden="true"><use href="#i-loop"/></svg></button>
      </div>
      <div class="player-seek">
        <span id="time-cur" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" />
        <span id="time-dur" class="time">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <span class="vol-icon"><svg class="ico" aria-hidden="true"><use href="#i-volume"/></svg></span>
      <input id="volume" type="range" min="0" max="100" value="80" />
    </div>
  </footer>

  <!-- Handy im Querformat: Hinweis statt verzogenem Layout (Musik läuft weiter) -->
  <div class="rotate-hint" role="alert">
    <svg class="ico rotate-phone" aria-hidden="true"><use href="#i-phone"/></svg>
    <div class="rotate-title">Bitte hochkant halten</div>
    <p>Riot Music ist fürs Hochformat gebaut. Die Musik läuft weiter.</p>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="/js/vendor/qrcode.js"></script>
  <script src="/js/accent.js"></script>
  <script src="/js/captcha.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // Service Worker registrieren (macht die Seite installierbar / PWA-fähig).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
